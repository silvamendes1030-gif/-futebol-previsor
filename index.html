<meta name="description" content="Ligas de futebol: equipas, calendário e últimos resultados (Premier League, La Liga, Bundesliga, Serie A, Ligue 1, Champions, Eredivisie, Eliteserien, Pro League belga). Dados em JSON no elemento #dados.">
<title>Ligas, Equipas e Jogos</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#6b7280;--ac:#16a34a;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#1a2029;--tx:#eef1f5;--mu:#9aa4b2;--bd:#2a323d}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#1a2029;--tx:#eef1f5;--mu:#9aa4b2;--bd:#2a323d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 14px;font-size:13px}
.back{background:none;border:0;color:var(--ac);font:inherit;padding:0 0 10px;cursor:pointer}
.list{display:grid;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:14px;font:inherit;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.it small{color:var(--mu)}
.row{display:flex;gap:8px;margin-bottom:6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.day{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:16px 4px 6px}
.g{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:6px}
.a{text-align:right}
.s{font-weight:700;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.t{color:var(--mu);font-weight:500}
.w{font-weight:700}
.me{color:var(--ac)}
.lg{grid-column:1/-1;font-size:11px;color:var(--mu);text-align:center;margin-top:-2px}
.e{color:var(--mu);text-align:center;padding:32px 0}
</style>
</head>
